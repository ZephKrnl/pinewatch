[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
pinewatch-mono = { path = "crates/pinewatch-mono" }
pinewatch-io = { path = "crates/pinewatch-io" }
pinewatch-kvt = { path = "crates/pinewatch-kvt" }
pinewatch-level = { path = "crates/pinewatch-level" }

# Dependencies stay small and pinned to a minor version. Format crates may only use
# sha1, png and windows-sys (see docs/ARCHITECTURE.md).
sha1 = "0.11"
windows-sys = "0.61"
bevy = "0.20"

# Keep debug builds playable: optimize dependencies, lightly optimize our own code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
